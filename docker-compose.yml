services:
  db:
    image: postgres:15-alpine
    container_name: telemedicina_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-telemedicina}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: telemedicina_api
    restart: always
    ports:
      # Por defecto solo se escucha en la propia máquina y Nginx publica la API.
      # Para probar sin Nginx define API_BIND_ADDRESS=0.0.0.0 en .env.
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-telemedicina}
    depends_on:
      - db

volumes:
  postgres_data:
