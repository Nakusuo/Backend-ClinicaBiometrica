name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Espejo oficial en AWS ECR Public: Docker Hub limita las descargas sin autenticación
        image: public.ecr.aws/docker/library/postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemedicina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Migraciones en PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemedicina
          SECRET_KEY: clave-solo-para-ci-con-mas-de-32-caracteres
        run: |
          python -m app.db.migrar
          # Falla si los modelos tienen cambios que no tienen migración
          alembic check
          alembic downgrade base
          python -m app.db.migrar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.12-slim -t telemedicina-api .
